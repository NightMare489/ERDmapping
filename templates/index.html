<!DOCTYPE html>
<html>
<head>
  <title>Form</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: linear-gradient(to bottom right, #2c3e50, #0f161c);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Courier New', Courier, monospace;

        min-height: 100vh;
    }

    form {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      background-color: #222;
      border-radius: 20px;
      box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.4);
      width: 80%;
      height: 50vh;
    }

    label {
      font-size: 24px;
      color: #fff;
    }

    textarea {
      width: 100%;
      height: 100%;
      margin-top: 10px;
      padding: 10px;
      border-radius: 10px;
      border: none;
      box-shadow: inset 0px 0px 10px rgba(0, 0, 0, 0.2);
      font-size: 16px;
      color: #fff;

      resize: none;
      background-color: #333;

    }
    textarea:focus{
        outline: none;
    }


    input[type="submit"] {
      margin-top: 20px;
      padding: 10px 20px;
      border-radius: 10px;
      border: none;
      background-color: #f39c12;
      color: #fff;
      font-size: 18px;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0px 0px 5px rgba(0, 0, 0, 0.4);
    }

    input[type="submit"]:hover {
      background-color: #e67e22;
    }




    /* on phone make height 90vh and width 95% */

    @media only screen and (max-width: 600px) {

        body{
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

      form {
        width: 95%;
        height: 90vh;
      }

        textarea {
            width: 90%;
        }

    }


  </style>
</head>
<body>
  <form action="{{ url_for('download') }}" method="POST">
    <label for="string">Enter text:</label><br>
    <textarea name="string" id="string"></textarea><br>
    <input type="submit" value="Download">
  </form>
</body>
</html>
