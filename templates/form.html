<!DOCTYPE html>
<html>
  <head>
    <title>ERD Mapping Generator</title>

    <link rel="icon" type="image/x-icon" href="favicon.png" />

    <style>
      * {
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, sans-serif;
      }

      h1 {
        font-size: 24px;
        margin-top: 30px;
        margin-bottom: 20px;
        text-align: center;
      }

      label {
        display: block;
        margin-bottom: 10px;
      }

      input[type="text"] {
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 16px;
        width: 100%;
        box-sizing: border-box;
        margin-bottom: 20px;
      }

      input[type="submit"] {
        background-color: #4caf50;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
      }

      input[type="submit"]:hover {
        background-color: #3e8e41;

    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #1a1a1a;
        color: #ffffff;
        overflow-x: hidden;
        overflow-y: auto;
      }

      .container {
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
        background-color: #2b2b2b;
        border-radius: 10px;
        box-shadow: 0 0 5px 3px rgba(0, 66, 25, 0.8);
      }

      h1 {
        text-align: center;
        margin-bottom: 30px;
      }

      label {
        display: block;
        margin-bottom: 10px;
        font-weight: bold;
      }

      input[type="text"] {
        width: 100%;
        padding: 10px;
        margin-bottom: 20px;
        border-radius: 5px;
        border: none;
        background-color: #3c3c3c;
        color: #ffffff;
        font-size: 16px;
      }

      button,
      input[type="submit"] {
        display: block;
        padding: 10px 20px;
        border-radius: 5px;
        background-color: #4caf50;
        color: #ffffff;
        font-size: 16px;
        cursor: pointer;
        border: none;

        /* modern floating neon glow effect */
        box-shadow: 0 0 5px rgba(255, 255, 255, 0.2);
        transition: 0.2s;

        user-select: none;
      }

      button:hover,
      input[type="submit"]:hover {
        background-color: #3e8e41;
        /* animated effect looping  */
        animation: pulse 1s infinite;
      }

      .dripple {
        animation: pulse 1s infinite;
      }

      .dripple:hover {
        /* remove animation */
        animation: none;
      }
      /* smoth shrink on click */

      button:active,
      input[type="submit"] {
        transform: scale(0.9);
      }

      .text-center {
        text-align: center;
      }

      .input-group {
        margin-bottom: 20px;
        border: 1px solid #ccc;
        padding: 10px;
        border-radius: 5px;
      }

      .input-group::after {
        content: "";
        display: table;
        clear: both;
      }

      .input-group label {
        float: left;
        width: 100px;
        margin-right: 10px;
        line-height: 32px;
      }

      .input-group input[type="text"] {
        float: left;
        width: calc(100% - 110px);
      }

      .delete-button {
        display: inline-block;
        margin-left: 10px;
        padding: 5px 10px;
        border-radius: 5px;
        background-color: #ff0000;
        color: #ffffff;
        font-size: 16px;
        cursor: pointer;
        border: none;
      }

      .delete-button:hover {
        background-color: #cc0000;
      }

      .buttons-container {
        display: flex;
        justify-content: space-between;
        margin-bottom: 20px;
      }

      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.5);
        }

        70% {
          box-shadow: 0 0 0 10px rgba(255, 255, 255, 0);
        }

        100% {
          box-shadow: 0 0 0 0 rgba(255, 255, 255, 0);
        }
      }

      .names {
        display: flex;
        flex-direction: column;

        align-items: center;

        padding: 10px;
        background-color: #2b2b2b;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        color: #ffffff;

        user-select: none;

        margin-bottom: 1rem;
      }

      .names ul {
        width: 100%;
        display: flex;
        flex-direction: row;

        justify-content: space-around;
        align-items: center;

        flex-wrap: wrap;

        list-style: none;
        padding: 0;
        margin-top: 0.5rem;
      }
      .names ul li {
        transition: 0.3s;
        margin: 0 1rem;
        padding: 0;
        font-size: 1.5rem;
        font-weight: bold;
        background-color: transparent;
        cursor: pointer;
      }
      .names ul li:hover {
        color: #4caf50;
        /* modern shadow styling with animation */
        box-shadow: 0px 5px 20px 0px rgba(255, 255, 255, 0.2);
      }

      @media screen and (min-width: 650px) {
        .buttons-container-side {
          position: fixed;

          background-color: #2b2b2b;
          padding: 10ch 0 10ch 10ch;
          border-radius: 5ch 0 0 5ch;

          box-shadow: 0 0 5px 3px rgba(0, 66, 25, 0.8);
          display: flex;
          flex-direction: column;
          align-items: flex-end;
          top: 50%;
          right: 0;
          transform: translateY(-50%);

          gap: 5ch;
          & .text-center {
            width: 200%;
            display: flex;
            justify-content: flex-end;
          }
          & button,
          & input[type="submit"] {
            border-radius: 5ch 0 0 5ch;
            width: 70%;
            text-align: center;
          }
          & input[type="submit"] {
            transform: translateX(20%);
            width: 100%;
          }
        }
      }

      .help_sign {
        position: fixed;
        bottom: 5%;
        left: 2%;
        padding: 10px;
        width: 2ch;
        height: 2ch;
        background-color: #2b2b2b;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        font-size: 3ch;
        text-align: center;
        
        & a {
          color: #ffffff;
          text-decoration: none;
        }
        & a:visited {
          color: #ffffff;
        }

        & a:hover {
          color: #4caf50;
        }

        & a:active {
          color: #4caf50;
        }
      }

      .help_sign::after {
        content: "Click for more help on how to use";

        opacity: 0;
        visibility: hidden;
        position: absolute;
        top: 0;
        left: 110%;
        width: 300%;
        height: 100%;
        background-color: #2b2b2b;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        font-size: 1ch;
        color: #ffffff;
        text-align: center;
        padding: 10px;

        transition: all 0.3s 0.5s ease-in-out;
      }

      .help_sign:hover::after {
        opacity: 1;
        visibility: visible;
      }
    </style>
  </head>

    <script>
      var add_field_button = document.getElementById("add_field");
      var load_field_button = document.getElementById("load_field");
      var save_field_button = document.getElementById("save_field");

      var form = document.getElementsByTagName("form")[0];
      var input_group_container = document.getElementById(
        "input-group-container"
      );

      add_field_button.addEventListener("click", function () {
        var input_group_new = document.createElement("div");
        input_group_new.setAttribute("class", "input-group");
        input_group_new.style.border = "1px solid #ccc";

        var label_new = document.createElement("label");
        label_new.setAttribute("for", "entity");
        label_new.innerText = "Entity name:";

        var entity_input_new = document.createElement("input");
        entity_input_new.setAttribute("type", "text");
        entity_input_new.setAttribute("name", "entity");
        // make it required
        entity_input_new.setAttribute("required", "required");

        var label_new2 = document.createElement("label");
        label_new2.setAttribute("for", "attributes");
        label_new2.innerText = "Attributes (comma-separated):";

        var attributes_input_new = document.createElement("input");
        attributes_input_new.setAttribute("type", "text");
        attributes_input_new.setAttribute("name", "attributes");
        // make it required
        attributes_input_new.setAttribute("required", "required");

        var delete_button_new = document.createElement("button");
        delete_button_new.setAttribute("type", "button");
        delete_button_new.setAttribute("class", "delete-button");
        delete_button_new.innerText = "Delete";
        delete_button_new.addEventListener("click", function () {
          deleteInputGroup(this);
        });

        input_group_new.appendChild(label_new);
        input_group_new.appendChild(entity_input_new);
        input_group_new.appendChild(label_new2);
        input_group_new.appendChild(attributes_input_new);
        input_group_new.appendChild(delete_button_new);

        input_group_container.appendChild(input_group_new);
      });

      function deleteInputGroup(button) {
        button.parentElement.remove();
      }

      save_field_button.addEventListener("click", function () {
        // Select all input fields within input_group_container
        var inputs = input_group_container.querySelectorAll("input");

        var inputString = "";
        for (var i = 0; i < inputs.length; i++) {
          inputString += inputs[i].value;
          if (i != inputs.length - 1) {
            inputString += "\n";
          }
        }

        var blob = new Blob([inputString], { type: "text/plain" });
        var url = URL.createObjectURL(blob);
        var link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", "download.erdmapping");
        link.click();
      });

      load_field_button.addEventListener("click", function () {
        var fileInput = document.createElement("input");
        fileInput.setAttribute("type", "file");
        fileInput.setAttribute("accept", ".erdmapping");
        fileInput.addEventListener("change", function () {
          var reader = new FileReader();
          reader.onload = function () {
            var inputString = reader.result;
            var inputValues = inputString.split("\n");
            var deleted_buttons = document.querySelectorAll(".delete-button");
            for (var i = 0; i < deleted_buttons.length; i++) {
              deleted_buttons[i].click();
            }
            for (var i = 0; i < inputValues.length; i += 2) {
              var inputGroup = document.createElement("div");
              inputGroup.setAttribute("class", "input-group");
              inputGroup.style.border = "1px solid #ccc";

              var entityLabel = document.createElement("label");
              entityLabel.setAttribute("for", "entity");
              entityLabel.innerText = "Entity name:";
              var entityInput = document.createElement("input");
              entityInput.setAttribute("type", "text");
              entityInput.setAttribute("name", "entity");
              entityInput.setAttribute("value", inputValues[i]);
              entityInput.setAttribute("required", "required");

              var attributesLabel = document.createElement("label");
              attributesLabel.setAttribute("for", "attributes");
              attributesLabel.innerText = "Attributes (comma-separated):";
              var attributesInput = document.createElement("input");
              attributesInput.setAttribute("type", "text");
              attributesInput.setAttribute("name", "attributes");
              attributesInput.setAttribute("value", inputValues[i + 1]);
              attributesInput.setAttribute("required", "required");

              var deleteButton = document.createElement("button");
              deleteButton.setAttribute("type", "button");
              deleteButton.setAttribute("class", "delete-button");
              deleteButton.innerText = "Delete";
              deleteButton.addEventListener("click", function () {
                deleteInputGroup(this);
              });

              inputGroup.appendChild(entityLabel);
              inputGroup.appendChild(entityInput);
              inputGroup.appendChild(attributesLabel);
              inputGroup.appendChild(attributesInput);
              inputGroup.appendChild(deleteButton);

              input_group_container.appendChild(inputGroup);
            }
          };

          reader.readAsText(fileInput.files[0]);
        });

        fileInput.click();
      });

      window.addEventListener("dragover", (e) => {
        e.preventDefault();
      });

      window.addEventListener("drop", (e) => {
        e.preventDefault();

        // Access the dropped files
        var file = e.dataTransfer.files[0];
        var reader = new FileReader();

        reader.onload = function (event) {
          console.log(event);
          var inputString = event.target.result;
          var inputValues = inputString.split("\n");
          var deleted_buttons = document.querySelectorAll(".delete-button");
          for (var i = 0; i < deleted_buttons.length; i++) {
            deleted_buttons[i].click();
          }
          for (var i = 0; i < inputValues.length; i += 2) {
            var inputGroup = document.createElement("div");
            inputGroup.setAttribute("class", "input-group");
            inputGroup.style.border = "1px solid #ccc";

            var entityLabel = document.createElement("label");
            entityLabel.setAttribute("for", "entity");
            entityLabel.innerText = "Entity name:";
            var entityInput = document.createElement("input");
            entityInput.setAttribute("type", "text");
            entityInput.setAttribute("name", "entity");
            entityInput.setAttribute("value", inputValues[i]);
            entityInput.setAttribute("required", "required");

            var attributesLabel = document.createElement("label");
            attributesLabel.setAttribute("for", "attributes");
            attributesLabel.innerText = "Attributes (comma-separated):";
            var attributesInput = document.createElement("input");
            attributesInput.setAttribute("type", "text");
            attributesInput.setAttribute("name", "attributes");
            attributesInput.setAttribute("value", inputValues[i + 1]);
            attributesInput.setAttribute("required", "required");

            var deleteButton = document.createElement("button");
            deleteButton.setAttribute("type", "button");
            deleteButton.setAttribute("class", "delete-button");
            deleteButton.innerText = "Delete";
            deleteButton.addEventListener("click", function () {
              deleteInputGroup(this);
            });

            inputGroup.appendChild(entityLabel);
            inputGroup.appendChild(entityInput);
            inputGroup.appendChild(attributesLabel);
            inputGroup.appendChild(attributesInput);
            inputGroup.appendChild(deleteButton);

            input_group_container.appendChild(inputGroup);
          }
        };

        // onyl if the fle extination is .erdmapping
        if (
          file.name.split(".").pop().toLowerCase() ==
            "erdmapping".toLocaleLowerCase() ||
          file.name.split(".").pop().toLowerCase() == "txt".toLocaleLowerCase()
        ) {
          reader.readAsText(file);
        } else {
          alert("Format not supported");
        }
      });
