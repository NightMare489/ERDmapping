<!DOCTYPE html>
<html>
<head>
    <title>ERD Mapping Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        h1 {
            font-size: 24px;
            margin-top: 30px;
            margin-bottom: 20px;
            text-align: center;
        }

        label {
            display: block;
            margin-bottom: 10px;
        }

        input[type="text"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        input[type="submit"]:hover {
            background-color: #3e8e41;
        }
    </style>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #FFFFFF;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #2b2b2b;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
            border: none;
            background-color: #3c3c3c;
            color: #FFFFFF;
            font-size: 16px;
        }

        button, input[type="submit"] {
            display: block;
            margin: 0 auto;
            padding: 10px 20px;
            border-radius: 5px;
            background-color: #4CAF50;
            color: #FFFFFF;
            font-size: 16px;
            cursor: pointer;
            border: none;

            /* modern floating neon glow effect */
            box-shadow: 0 0 5px rgba(255, 255, 255, 0.2);
            transition: 0.2s;

            user-select: none;

        }

        button:hover, input[type="submit"] {
            background-color: #3e8e41;
            /* animated effect looping  */
            animation: pulse 1s infinite;
        }

        /* smoth shrink on click */

        button:active, input[type="submit"] {
            transform: scale(0.9);
        }

        .text-center {
            text-align: center;
        }

        .input-group {
            margin-bottom: 20px;
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 5px;
        }

        .input-group::after {
            content: "";
            display: table;
            clear: both;
        }

        .input-group label {
            float: left;
            width: 100px;
            margin-right: 10px;
            line-height: 32px;
        }

        .input-group input[type="text"] {
            float: left;
            width: calc(100% - 110px);
        }

        .delete-button {
            display: inline-block;
            margin-left: 10px;
            padding: 5px 10px;
            border-radius: 5px;
            background-color: #FF0000;
            color: #FFFFFF;
            font-size: 16px;
            cursor: pointer;
            border: none;
        }

        .delete-button:hover {
            background-color: #CC0000;
        }

        .buttons-container {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.2);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(255, 255, 255, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0);
            }
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>ERD Mapping Generator</h1>

        <form method="POST" action="/convert">
            
            <div class="buttons-container">

                <div class="text-center">
                    <button type="button" id="add_field" >Add</button>
                </div>
                
                <div class="text-center">
                    <input type="submit" value="Convert and Save">
                </div>
            </div>
            <div id="input-group-container">
            </div>
        </form>
    </div>

    <script>
        var add_field_button = document.getElementById('add_field');
        var form = document.getElementsByTagName('form')[0];
        var input_group_container = document.getElementById('input-group-container');

        add_field_button.addEventListener('click', function() {
            var input_group_new = document.createElement('div');
            input_group_new.setAttribute('class', 'input-group');
            input_group_new.style.border = "1px solid #ccc";

            var label_new = document.createElement('label');
            label_new.setAttribute('for', 'entity');
            label_new.innerText = 'Entity name:';

            var entity_input_new = document.createElement('input');
            entity_input_new.setAttribute('type', 'text');
            entity_input_new.setAttribute('name', 'entity');
            // make it required
            entity_input_new.setAttribute('required', 'required');


            var label_new2 = document.createElement('label');
            label_new2.setAttribute('for', 'attributes');
            label_new2.innerText = 'Attributes (comma-separated):';


            var attributes_input_new = document.createElement('input');
            attributes_input_new.setAttribute('type', 'text');
            attributes_input_new.setAttribute('name', 'attributes');
            // make it required
            attributes_input_new.setAttribute('required', 'required');



            var delete_button_new = document.createElement('button');
            delete_button_new.setAttribute('type', 'button');
            delete_button_new.setAttribute('class', 'delete-button');
            delete_button_new.innerText = 'Delete';
            delete_button_new.addEventListener('click', function() {
                deleteInputGroup(this);
            });

           input_group_new.appendChild(label_new);
            input_group_new.appendChild(entity_input_new);
            input_group_new.appendChild(label_new2);
            input_group_new.appendChild(attributes_input_new);
            input_group_new.appendChild(delete_button_new);

            input_group_container.appendChild(input_group_new);
        });

        function deleteInputGroup(button) {
            button.parentElement.remove();
        }
    </script>
</body>
</html>
